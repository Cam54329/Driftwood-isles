<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16222c">
<title>Driftwood Isles</title>
<meta name="description" content="Driftwood Isles: a cozy multiplayer fishing game.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Josefin+Sans:wght@300;400;600;700&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: full-bleed 3D world. Game HUD in the corners (minimap top-left, compass top-centre, buttons top-right,
   level + coins bottom-right, numbered hotbar bottom-centre). Panels are flat dark slabs with solid action buttons.
   The main menu sits over a live 3D shot of the dock, title and plain text options right of centre. */
:root{
 --ink:#f4f1ea;--ink2:#b9c0c6;--ink3:#7f8890;
 --panel:rgba(14,18,24,.86);--panel2:rgba(26,32,40,.94);--slot:rgba(12,15,20,.62);--line:rgba(255,255,255,.12);--line2:rgba(255,255,255,.22);
 --gold:#f2c14e;--gold2:#ffd97a;--green:#3fa457;--green2:#4fc06a;--blue:#3a7fc0;--blue2:#4b98dd;--red:#c94c40;--purple:#7d62cf;
 --hud:'Nunito',system-ui,sans-serif;--menu:'Josefin Sans','Nunito',system-ui,sans-serif;
 --stroke:0 0 2px #000,0 1px 0 #000,1px 0 0 #000,-1px 0 0 #000,0 -1px 0 #000,0 2px 8px rgba(0,0,0,.55);
 --sh:0 10px 30px -12px rgba(0,0,0,.7);
 color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#16222c;color:var(--ink);font:700 14px var(--hud);}
[hidden]{display:none!important}
body{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
kbd{font:800 11px var(--hud);background:rgba(255,255,255,.14);border:1px solid var(--line2);border-radius:4px;padding:1px 6px;color:var(--ink)}
.out{color:var(--ink);text-shadow:var(--stroke)}

/* ---------- HUD frame ---------- */
.hud{position:fixed;z-index:10;pointer-events:none;transition:opacity .4s}
.hud>*{pointer-events:auto}
body.photo .hud,body.photo #toasts,body.photo #feed,body.photo #catchCard,body.photo #chat,body.menu .hud,body.menu #chat,body.menu #feed,body.joining .hud,body.joining #feed{opacity:0;pointer-events:none!important}
body.photo .hud *,body.menu .hud *,body.joining .hud *{pointer-events:none!important}
#zoneBan{position:fixed;z-index:9;top:24%;left:50%;transform:translate(-50%,8px);font:300 clamp(34px,6vw,62px)/1 var(--menu);letter-spacing:.12em;text-transform:uppercase;text-shadow:0 3px 24px rgba(0,0,0,.45);opacity:0;transition:opacity .9s,transform .9s;pointer-events:none;text-align:center;white-space:nowrap}
#zoneBan small{display:block;font:700 13px var(--hud);letter-spacing:.3em;margin-top:10px;color:var(--gold2)}
#zoneBan.show{opacity:1;transform:translate(-50%,0)}
body.menu #zoneBan,body.photo #zoneBan,body.joining #zoneBan{opacity:0}

/* top-left: minimap + buffs */
#tl{top:calc(12px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.mm{position:relative;width:168px;height:168px;border-radius:50%;overflow:hidden;background:#1d4a62;box-shadow:0 0 0 3px rgba(12,15,20,.7),0 0 0 4px rgba(255,255,255,.25),var(--sh);cursor:pointer}
.mm canvas{width:100%;height:100%;display:block}
.mm .n{position:absolute;top:6px;left:50%;transform:translateX(-50%);font:900 11px var(--hud);text-shadow:var(--stroke);letter-spacing:.05em}
#mmZone{display:block;width:168px;text-align:center;font:800 12px var(--hud);text-shadow:var(--stroke);margin-top:-2px}
#buffBar{display:flex;gap:5px;flex-wrap:wrap;max-width:200px}
.bf{display:flex;align-items:center;gap:6px;padding:2px 8px 2px 2px;border-radius:4px;background:var(--slot);font:800 12px var(--hud);font-variant-numeric:tabular-nums;text-shadow:var(--stroke)}
.bf i,.bfi{width:20px;height:20px;border-radius:3px;display:grid;place-items:center;font:900 10px var(--hud);font-style:normal;color:#fff;background:var(--c);flex:none;text-shadow:none}.bfi{width:30px;height:30px;font-size:13px}

/* top-centre: compass + event */
#tc{top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;width:min(420px,calc(100vw - 420px));min-width:220px}
#compass{position:relative;width:100%;height:26px;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent);mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent)}
#compassStrip{position:absolute;top:0;left:0;height:100%;white-space:nowrap;font:900 13px var(--hud);text-shadow:var(--stroke)}
#compassStrip span{position:absolute;top:4px;transform:translateX(-50%);color:var(--ink)}
#compassStrip span.t{color:var(--ink3);font-size:10px;top:7px}
#compassStrip span.c{color:var(--gold2)}
#compass::after{content:"";position:absolute;left:50%;bottom:0;width:2px;height:7px;margin-left:-1px;background:var(--gold);box-shadow:0 0 0 1px rgba(0,0,0,.6)}
#eventBan{padding:6px 16px;border-radius:4px;background:var(--panel);border:1px solid var(--line);text-align:center;font:900 14px/1.2 var(--hud);white-space:nowrap;max-width:calc(100vw - 32px);animation:drop .5s cubic-bezier(.2,.9,.3,1.2)}
#eventBan small{display:block;font:700 11px var(--hud);color:var(--ink2);white-space:normal}
#eventBan i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:1px;background:var(--ev,var(--gold))}
#eventBan.big{border-color:var(--ev,var(--gold));box-shadow:0 0 0 1px var(--ev,var(--gold)),0 0 26px -6px var(--ev,var(--gold))}
#eventBan.big i{animation:evPulse 1.6s ease-in-out infinite}@keyframes evPulse{50%{box-shadow:0 0 0 7px rgba(255,255,255,.15)}}

/* top-right: buttons */
#tr{top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:300px}
.ib{position:relative;width:40px;height:40px;border-radius:6px;display:grid;place-items:center;background:var(--slot);border:1px solid var(--line);color:var(--ink);transition:background .15s,transform .15s}
.ib:hover{background:rgba(30,36,44,.9)}.ib:active{transform:scale(.92)}
.ib svg{width:20px;height:20px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.7))}
.ib .badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--green);color:#fff;font:900 11px/18px var(--hud);text-align:center}
.ib .badge.off{background:#59616a}
.desk .mob-only{display:none!important}

/* bottom-right: clock, level, coins */
#br{right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:flex-end;gap:2px;text-align:right}
.clock{display:flex;align-items:center;gap:7px;font:900 14px var(--hud);text-shadow:var(--stroke);font-variant-numeric:tabular-nums}
.clock svg{width:22px;height:22px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.6))}
.clock small{font:800 12px var(--hud);color:var(--ink2)}
#lvlTxt{font:900 26px/1.05 var(--hud);text-shadow:var(--stroke)}
.xpbar{width:150px;height:6px;border-radius:3px;background:rgba(0,0,0,.55);box-shadow:0 0 0 1px rgba(255,255,255,.2);overflow:hidden}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4fc06a,#9be07a);transition:width .6s}
.coins{display:flex;align-items:center;gap:8px;font:900 28px/1.1 var(--hud);text-shadow:var(--stroke);font-variant-numeric:tabular-nums}
.coin{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff5c8,#f2c14e 50%,#b8862a);box-shadow:0 0 0 2px rgba(0,0,0,.55);flex:none}
#relicTxt{font:800 12px var(--hud);color:#9fe6ff;text-shadow:var(--stroke)}
.br-desk-gap{height:4px}

/* bottom-centre: prompt, power, hotbar */
#bottom{left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px}
#prompt{padding:5px 12px;border-radius:4px;background:var(--panel);font:800 14px var(--hud);display:flex;align-items:center;gap:8px;white-space:nowrap;animation:rise .2s ease-out}
#gear{display:none}
#power{width:min(300px,70vw);padding:6px 10px 8px;border-radius:4px;background:var(--panel)}
#power .pl{display:flex;justify-content:space-between;font:800 12px var(--hud);color:var(--ink2)}
#power .pb{height:10px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:4px}
#power .pb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4fc06a,#f2c14e 60%,#e07a4a)}
#hotbar{display:flex;gap:4px}
.hs{position:relative;width:66px;height:66px;border-radius:5px;background:var(--slot);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 3px 4px;text-align:center;transition:background .08s,border-color .08s,transform .06s}
.hs:hover{background:rgba(26,32,40,.85);border-color:var(--line2)}.hs:active{transform:scale(.94)}
.hs.on{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.hs .k{position:absolute;top:3px;left:5px;font:900 11px var(--hud);color:var(--ink2);text-shadow:var(--stroke)}
.hs .q{position:absolute;top:3px;right:5px;font:900 10px var(--hud);color:var(--gold2);text-shadow:var(--stroke)}
.hs svg{width:26px;height:26px;margin-bottom:3px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.7))}
.hs b{display:block;width:100%;font:800 10px/1.15 var(--hud);text-shadow:var(--stroke);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.hs small{display:block;width:100%;font:700 9px/1.1 var(--hud);color:var(--gold2);text-shadow:var(--stroke);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

/* mobile controls */
#ctrls{right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(150px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:auto auto;align-items:end;gap:10px}
#ctrls .col{display:flex;flex-direction:column;align-items:center;gap:10px}
.rb{border-radius:50%;display:grid;place-items:center;font:900 15px/1 var(--hud);touch-action:none;color:var(--ink);background:rgba(12,15,20,.62);border:2px solid rgba(255,255,255,.35);text-shadow:var(--stroke);transition:transform .12s}
.rb:active,.rb.on{transform:scale(.93)}
#castBtn{width:86px;height:86px;font-size:16px;letter-spacing:.06em;border-color:var(--gold);background:rgba(40,32,12,.6)}
#jumpBtn{width:56px;height:56px;font-size:12px}
#actBtn{min-width:80px;height:46px;border-radius:23px;padding:0 16px;border-color:var(--green2);background:rgba(20,50,28,.65)}
.camrot{display:flex;gap:6px}.camrot .rb{width:40px;height:40px}.camrot svg{width:18px;height:18px}
.desk #jumpBtn,.desk #actBtn,.desk .camrot,.desk #castBtn,.desk #joy{display:none}
#joy{left:calc(22px + env(safe-area-inset-left,0px));bottom:calc(150px + env(safe-area-inset-bottom,0px));width:124px;height:124px;border-radius:50%;background:rgba(12,15,20,.3);border:2px solid rgba(255,255,255,.3);touch-action:none}
#joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(244,241,234,.85);box-shadow:0 4px 10px rgba(0,0,0,.4);transition:transform .08s}

/* emote menu */
#emoteMenu{position:fixed;z-index:15;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:6px;border-radius:6px;background:var(--panel);border:1px solid var(--line);display:flex;gap:4px;animation:rise .18s ease-out}
#emoteMenu button{display:flex;flex-direction:column;align-items:center;gap:3px;width:70px;padding:8px 4px;border-radius:4px;font:800 12px var(--hud)}
#emoteMenu button:hover{background:rgba(255,255,255,.08)}
#emoteMenu svg{width:24px;height:24px;color:var(--gold2)}
#emoteMenu kbd{font-size:10px}
body:not(.desk) #emoteMenu kbd{display:none}

/* chat */
#chat{position:fixed;z-index:11;left:calc(12px + env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:clamp(190px,calc(50vw - 300px),330px);display:flex;flex-direction:column;gap:5px;transition:opacity .4s}
#chatLog{display:flex;flex-direction:column;gap:2px;max-height:190px;overflow-y:auto;scrollbar-width:none;transition:opacity .6s;padding:6px 8px;border-radius:5px;background:rgba(12,15,20,.42)}
#chatLog::-webkit-scrollbar{display:none}
#chatLog:empty{display:none}
#chat.idle #chatLog{opacity:0}
#chat.idle:hover #chatLog,#chat:focus-within #chatLog{opacity:1}
.cl{font:700 13px/1.35 var(--hud);text-shadow:var(--stroke);overflow-wrap:anywhere}
.cl b{font-weight:900;margin-right:5px}
.cl.sys{color:var(--ink2);font-style:italic}
.cl.feed{color:var(--gold2)}
#chatForm{display:flex;gap:4px}
#chatIn{flex:1;min-width:0;border:1px solid var(--line);border-radius:4px;padding:8px 10px;font:700 13px var(--hud);color:var(--ink);background:rgba(12,15,20,.7);outline:none}
#chatIn::placeholder{color:var(--ink3)}
#chatSend{padding:0 12px;border-radius:4px;font:900 13px var(--hud);background:var(--blue);color:#fff}
#chatClose{display:none;width:36px;height:36px}
#chatClear{position:absolute;right:4px;top:4px;width:26px;height:26px;z-index:2;opacity:.55;background:rgba(12,15,20,.6)}#chatClear:hover{opacity:1}#chatClear svg{width:14px;height:14px}#chat.idle #chatClear{opacity:0;pointer-events:none}#chat:has(#chatLog:empty) #chatClear{display:none}
body:not(.desk) #chat.open #chatClear{top:12px;right:12px}
#devBtn{font:900 11px var(--hud);letter-spacing:.06em;color:#ffcf5a}
#devBar{position:fixed;z-index:40;left:calc(12px + env(safe-area-inset-left,0px));top:calc(200px + env(safe-area-inset-top,0px));width:min(300px,calc(100vw - 24px));max-height:calc(100vh - 260px);overflow:auto;padding:8px 10px 10px;border-radius:6px;background:rgba(14,18,24,.94);border:1px solid #ffcf5a55;box-shadow:var(--sh);font:700 12px var(--hud)}
#devBar .dv-h{display:flex;align-items:center;gap:8px;margin-bottom:4px}#devBar .dv-h b{font:900 13px var(--hud);color:#ffcf5a;letter-spacing:.08em;text-transform:uppercase}#devBar .dv-h span{flex:1;color:var(--ink3)}
#devBar h4{margin:8px 0 4px;font:900 10px var(--hud);letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
#devBar .dv-r{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px}
#devBar button{padding:5px 8px;border-radius:3px;background:rgba(255,255,255,.1);font:800 12px var(--hud)}#devBar button:hover{background:rgba(255,255,255,.18)}#devBar button.on{background:#3fa457}#devBar button.warn{background:#c94c40}
#devBar select{flex:1;min-width:0;background:var(--slot);color:var(--ink);border:1px solid var(--line2);border-radius:3px;padding:4px;font:700 12px var(--hud)}
#devBar small{color:var(--ink3);line-height:1.4}
body.menu #devBar,body.photo #devBar{display:none}
#fadeOver{position:fixed;inset:0;z-index:90;background:radial-gradient(circle at 50% 60%,#0a3a48,#020c12);opacity:0;pointer-events:none;transition:opacity .6s}#fadeOver.on{opacity:1}
.cas{align-items:center;text-align:center}.reels{display:flex;gap:10px;justify-content:center;margin:6px 0}
.reel{width:78px;height:86px;display:grid;place-items:center;font-size:46px;border-radius:6px;background:linear-gradient(#0c1016,#1e2630 40%,#1e2630 60%,#0c1016);box-shadow:inset 0 0 0 2px #c8a040,inset 0 4px 12px rgba(0,0,0,.6)}
.reel.spin{animation:reelBlur .1s linear infinite}@keyframes reelBlur{50%{transform:translateY(3px);filter:blur(1.5px)}}
.wheelBox{position:relative;width:230px;height:230px;margin:6px auto}.wheelBox svg{width:100%;height:100%;filter:drop-shadow(0 6px 12px rgba(0,0,0,.5))}
.wheelPin{position:absolute;left:50%;top:-4px;width:0;height:0;margin-left:-11px;border:11px solid transparent;border-top:20px solid #f2c14e;filter:drop-shadow(0 2px 2px #000)}
.cards{display:flex;justify-content:center;gap:6px;margin:6px 0;flex-wrap:wrap}
.pcard.sm{width:52px;height:72px;font-size:24px;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center}.pcard small{font-size:18px}.pcard.red{color:#c8303a}.pcard.back{background:repeating-linear-gradient(45deg,#7a1e2a 0 6px,#5a1420 6px 12px);color:#f2c14e}
.coinBig{font-size:64px;line-height:1.2}.coinBig.flip{animation:coinFlip .25s linear infinite}@keyframes coinFlip{50%{transform:scaleX(.1)}}
.shells,.lanterns{display:flex;gap:10px;justify-content:center;margin:6px 0}.shellB,.lanB{width:74px;height:74px;font-size:40px;border-radius:8px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 2px rgba(200,160,64,.5)}
.shellB:not(:disabled):hover,.lanB:not(:disabled):hover{background:rgba(255,255,255,.16);transform:translateY(-2px)}.shellB.win,.lanB.win{box-shadow:inset 0 0 0 3px #f2c14e,0 0 18px rgba(242,193,78,.6)}.lanB b{font:900 20px var(--hud);color:#ffd86a}
.diceRow{font-size:72px;line-height:1;display:flex;gap:14px;justify-content:center}.diceRow.roll span{display:inline-block;animation:diceRoll .2s linear infinite}@keyframes diceRoll{50%{transform:rotate(20deg) translateY(-4px)}}
.crashBox{width:100%;padding:10px;border-radius:6px;background:linear-gradient(#2a1410,#14080a)}.crashBox b{display:block;font:900 46px var(--hud);color:#ffb04a;text-shadow:0 0 18px rgba(255,120,40,.6)}.crashBox.dead b{color:#ff4a3a}
.crashBar{height:10px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}.crashBar i{display:block;height:100%;background:linear-gradient(90deg,#f2c14e,#ff5a2a)}
.rouNum{width:96px;height:96px;margin:4px auto;border-radius:50%;display:grid;place-items:center;font:900 40px var(--hud);background:#2a3440;box-shadow:inset 0 0 0 4px #c8a040}.rouNum.red{background:#b8303a}.rouNum.black{background:#1a1c22}.rouNum.green{background:#1e7a3a}.rouNum.spin{animation:hotShake .1s linear infinite}
.cas select{background:var(--slot);color:var(--ink);border:1px solid var(--line2);border-radius:4px;padding:5px;font:700 13px var(--hud)}
.mines{display:grid;grid-template-columns:repeat(5,46px);gap:5px;justify-content:center;margin:6px 0}.mineB{height:46px;border-radius:6px;font-size:22px;background:linear-gradient(#3a3060,#241c40);box-shadow:inset 0 0 0 1px rgba(200,170,255,.3)}
.mineB:not(:disabled):hover{background:linear-gradient(#4a4078,#2e2450)}.mineB.ok{background:#1e3a4a}.mineB.boom{background:#5a1a1a}.pcard{width:84px;height:116px;display:grid;place-items:center;font:900 44px var(--hud);color:#1a1c22;background:#f4f1ea;border-radius:8px;box-shadow:0 6px 16px rgba(0,0,0,.5),inset 0 0 0 3px #c8a040}
body:not(.desk) #chat{display:none}
body:not(.desk) #chat.open{display:flex;left:10px;right:10px;width:auto;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:45;padding:10px;border-radius:6px;background:var(--panel2)}
body:not(.desk) #chat.open #chatLog{max-height:38vh;opacity:1}
body:not(.desk) #chat.open #chatClose{display:grid}

/* rare catch feed */
#feed{position:fixed;z-index:12;right:calc(12px + env(safe-area-inset-right,0px));top:calc(64px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:flex-end;gap:4px;pointer-events:none;width:min(320px,calc(100vw - 32px));transition:opacity .4s}
.fd{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:4px;background:var(--panel);border-left:3px solid var(--c);font:700 12px/1.3 var(--hud);animation:slideIn .45s cubic-bezier(.2,.9,.3,1.2)}
.fd .dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--c)}
.fd.out{animation:fadeOut .5s forwards}
@keyframes slideIn{from{transform:translateX(24px);opacity:0}}
@keyframes fadeOut{to{transform:translateX(12px);opacity:0}}

@keyframes float{50%{transform:translateY(-5px)}}
@keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(1.5);opacity:0}}@keyframes pop{to{transform:scale(1.6);opacity:0}}@keyframes fade{to{transform:scale(.7);opacity:0}}

/* fishing: waiting tip, strike prompt, classic reel-in panel (tension gauge, line out, fish stamina) */
#fishTip{position:fixed;z-index:12;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font:800 13px var(--hud);padding:7px 14px;border-radius:4px;background:var(--panel);color:var(--ink2);pointer-events:none;white-space:nowrap;box-shadow:var(--sh)}

@keyframes nib{30%{transform:translateX(-50%) scale(1.08)}}
body.menu #fishTip,body.photo #fishTip,body.menu #hook,body.menu #reel{display:none!important}
#hook{position:fixed;z-index:26;left:50%;top:34%;width:150px;height:150px;margin:-75px 0 0 -75px;pointer-events:none;display:grid;place-items:center}
#hook .hk-ring{position:absolute;inset:0;border-radius:50%;border:5px solid var(--gold2);box-shadow:0 0 26px rgba(242,193,78,.55),inset 0 0 18px rgba(242,193,78,.3);animation:hookRing var(--hw,1s) linear forwards}
#hook .hk-core{font:900 32px/1 var(--hud);letter-spacing:.05em;color:#fff;text-shadow:var(--stroke);text-align:center;animation:hookPop .3s cubic-bezier(.2,1.7,.4,1)}
#hook small{display:block;font:800 12px var(--hud);letter-spacing:.06em;color:var(--ink);margin-top:6px}
#hook .hk-perfect{position:absolute;inset:0;border-radius:50%;border:2px dashed rgba(255,231,140,.75);transform:scale(1.39);animation:hkPf var(--hw,1s) linear forwards}
@keyframes hkPf{0%,29%{opacity:1}31%,100%{opacity:0}}
#strikeFx{position:fixed;inset:0;z-index:24;pointer-events:none;opacity:0}
#strikeFx.bite{animation:sfx .55s ease-out;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(10,40,60,.55))}

@keyframes sfx{0%{opacity:0}12%{opacity:1}100%{opacity:0}}
@keyframes hookRing{from{transform:scale(1.7);opacity:0}8%{opacity:1}to{transform:scale(.6);border-color:#ff6a4a}}
@keyframes hookPop{from{transform:scale(.3);opacity:0}}
.floatTip{position:fixed;z-index:27;left:50%;top:34%;transform:translateX(-50%);font:900 26px var(--hud);color:var(--gold2);text-shadow:var(--stroke);pointer-events:none;animation:floatUp 1.3s ease-out forwards}

.glow{filter:drop-shadow(0 0 5px var(--g,#9dff7a))}.prism{animation:hue 2s linear infinite}@keyframes hue{to{filter:hue-rotate(360deg)}}.shiny{filter:brightness(1.18) drop-shadow(0 0 3px #fff7b0)}

.hat{padding:6px 11px;border-radius:4px;font:800 13px var(--hud);background:rgba(255,255,255,.08);color:var(--ink2)}
.hat.on{background:rgba(242,193,78,.2);color:var(--gold2);box-shadow:inset 0 0 0 1px var(--gold)}

/* ---------- main menu ---------- */
#menu{position:fixed;inset:0;z-index:60;pointer-events:none;transition:opacity .45s}
#menu.fade{opacity:0}
#menu::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,20,30,0) 35%,rgba(10,20,30,.28) 70%,rgba(10,20,30,.4));pointer-events:none}
.mm-box{position:absolute;left:58%;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:26px;pointer-events:auto;text-align:center}
.mm-title{display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.35)}
.mm-title svg{width:86px;height:58px;filter:drop-shadow(0 2px 8px rgba(0,0,0,.35))}
.mm-title h1{margin:0;font:600 clamp(40px,5.6vw,74px)/.95 var(--menu);letter-spacing:.08em;text-transform:uppercase}
.mm-title p{margin:0;font:400 clamp(13px,1.3vw,16px) var(--menu);letter-spacing:.42em;text-transform:uppercase;opacity:.85}
.mm-nav{display:flex;flex-direction:column;align-items:center;gap:6px}
.mm-nav button{font:400 clamp(17px,1.7vw,22px)/1.3 var(--menu);letter-spacing:.14em;text-transform:uppercase;color:#f4f1ea;text-shadow:0 1px 10px rgba(0,0,0,.45);padding:2px 10px;transition:color .2s,letter-spacing .25s}
.mm-nav button:hover,.mm-nav button:focus-visible,.mm-nav button.sel{color:var(--gold2);letter-spacing:.2em;outline:none}
.mm-foot{position:absolute;left:max(18px,env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));font:400 12px var(--menu);letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.75);text-shadow:0 1px 6px rgba(0,0,0,.5);pointer-events:none}
.mm-status{font:400 13px var(--menu);letter-spacing:.12em;color:rgba(255,255,255,.85);text-shadow:0 1px 8px rgba(0,0,0,.5);min-height:1em}
@media (max-width:760px){.mm-box{left:50%;top:auto;bottom:calc(40px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);gap:16px}#menu::before{background:linear-gradient(180deg,rgba(10,20,30,0) 40%,rgba(10,20,30,.45))}}

/* pause */
#pause{position:fixed;inset:0;z-index:55;display:grid;place-items:center;background:rgba(6,10,14,.55);animation:fadeIn .2s}
.pz{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.pz h2{margin:0 0 12px;font:600 40px var(--menu);letter-spacing:.14em;text-transform:uppercase}
.pz button{font:400 21px/1.3 var(--menu);letter-spacing:.14em;text-transform:uppercase;padding:2px 12px;transition:color .2s,letter-spacing .25s}
.pz button:hover,.pz button:focus-visible{color:var(--gold2);letter-spacing:.2em;outline:none}

/* photo mode */
#photoBar{position:fixed;z-index:41;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:8px 10px 8px 16px;border-radius:6px;background:var(--panel);transition:opacity .5s;width:min(460px,calc(100vw - 32px))}
#photoBar.dim{opacity:0}#photoBar b{font:900 14px var(--hud);white-space:nowrap}#photoBar svg{width:18px;height:18px;flex:none}

/* loading */
#loading{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:linear-gradient(180deg,#2c4f68,#5c8aa6 60%,#d8b88c);padding:16px;transition:opacity .8s}
#loading.out{opacity:0;pointer-events:none}
.ld{text-align:center;width:min(340px,100%)}
.ld h1{margin:0 0 16px;font:600 40px/1 var(--menu);letter-spacing:.1em;text-transform:uppercase;color:#fff;text-shadow:0 3px 18px rgba(0,0,0,.3)}
.ld .bar{height:4px;border-radius:2px;background:rgba(255,255,255,.35);overflow:hidden}
.ld .bar i{display:block;height:100%;width:8%;background:#fff;transition:width .4s}
.ld small{display:block;margin-top:12px;font:400 13px var(--menu);letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.9)}


/* =================================================================================================
   THEME — "calm water": simple, relaxed and readable. Soft translucent rounded panels over the world,
   Fredoka for titles, buttons and numbers, Nunito for reading text, flat friendly buttons, pill tabs.
   Everything here overrides the base layout above.
   ================================================================================================= */
:root{
 --ink:#ffffff;--ink2:#d4dde6;--ink3:#97a6b4;
 --panel:rgba(16,22,30,.72);--panel2:rgba(18,24,33,.86);--slot:rgba(16,22,30,.6);--line:rgba(255,255,255,.12);--line2:rgba(255,255,255,.24);
 --gold:#ffc84a;--gold2:#ffd76e;--green:#4cbb5a;--green2:#7bd987;--blue:#4a9be8;--blue2:#74b6f2;--red:#e8584a;--purple:#9a7ae0;
 --hud:'Nunito',system-ui,sans-serif;--title:'Fredoka','Nunito',system-ui,sans-serif;--menu:'Fredoka','Nunito',system-ui,sans-serif;
 --stroke:0 1px 0 rgba(0,0,0,.55),0 0 4px rgba(0,0,0,.55),0 2px 10px rgba(0,0,0,.3);
 --soft:0 10px 30px -12px rgba(0,0,0,.55);--edge:inset 0 0 0 1.5px rgba(255,255,255,.14);--sh:var(--soft);
}
html,body{font:700 14px var(--hud)}
kbd{font:600 12px var(--title);color:#fff;background:rgba(255,255,255,.16);border:0;border-radius:6px;padding:1px 7px}
.out{text-shadow:var(--stroke)}
/* HUD */
.mm{box-shadow:0 0 0 3px rgba(255,255,255,.85),0 0 0 5px rgba(0,0,0,.18),var(--soft)}
.mm .n{font:600 13px var(--title);text-shadow:var(--stroke)}
#mmZone{font:600 15px var(--title);text-shadow:var(--stroke);margin-top:4px}
.bf{border-radius:10px;background:var(--slot);box-shadow:var(--edge);font:600 13px var(--title);text-shadow:none}.bf i{border-radius:6px}
#compassStrip{font:600 14px var(--title);text-shadow:var(--stroke)}#compass::after{background:#fff;width:3px;height:8px;border-radius:2px}
#eventBan{border-radius:14px;background:var(--panel);border:0;box-shadow:var(--edge),var(--soft);backdrop-filter:blur(8px);padding:7px 18px;font:600 16px/1.2 var(--title)}
#eventBan small{font:700 12px var(--hud);color:var(--ink2)}
#eventBan.big{box-shadow:var(--edge),0 0 0 2px var(--ev,var(--gold)),0 0 26px -6px var(--ev,var(--gold))}
.ib{width:44px;height:44px;border-radius:14px;background:var(--panel);border:0;box-shadow:var(--edge),var(--soft);backdrop-filter:blur(8px);color:#fff}
.ib:hover{background:rgba(32,42,56,.85)}.ib:active{transform:scale(.94)}.ib svg{width:21px;height:21px;filter:none}
.ib .badge{background:var(--green);box-shadow:0 0 0 2px rgba(16,22,30,.9);font:600 11px/18px var(--title)}
#devBtn{font:600 12px var(--title);color:var(--gold2)}
.clock{font:600 15px var(--title);text-shadow:var(--stroke)}.clock small{font:700 12px var(--hud);color:var(--ink2)}
#lvlTxt{font:700 28px/1.05 var(--title);text-shadow:var(--stroke)}
.xpbar{width:150px;height:8px;border-radius:999px;background:rgba(0,0,0,.4);box-shadow:var(--edge)}.xpbar i{border-radius:999px;background:linear-gradient(90deg,#7bd987,#b8f0a0)}
.coins{font:700 30px/1.1 var(--title);text-shadow:var(--stroke)}
.coin{width:24px;height:24px;background:radial-gradient(circle at 35% 30%,#fff7c8,#ffc84a 50%,#e0961a);box-shadow:0 0 0 2px rgba(0,0,0,.3)}
#relicTxt{font:600 13px var(--title)}
#prompt{border-radius:999px;background:var(--panel);box-shadow:var(--edge),var(--soft);backdrop-filter:blur(8px);padding:6px 16px 6px 7px;font:600 15px var(--title)}
#power{border-radius:14px;background:var(--panel);box-shadow:var(--edge),var(--soft);padding:7px 12px 9px}#power .pl{font:600 13px var(--title)}
#power .pb{height:10px;border-radius:999px;background:rgba(0,0,0,.35)}#power .pb i{border-radius:999px;background:linear-gradient(90deg,#7bd987,#ffd76e 60%,#f48a5a)}
#hotbar{gap:6px}
.hs{width:66px;height:66px;border-radius:16px;border:0;background:var(--panel);box-shadow:var(--edge),var(--soft);backdrop-filter:blur(8px)}

.hs .k{top:4px;left:7px;font:600 11px var(--title);color:var(--ink3);text-shadow:none}.hs .q{font:600 11px var(--title);color:var(--gold2);text-shadow:none}
.hs svg{color:#fff;filter:none}.hs b{font:600 11.5px/1.1 var(--title);text-shadow:none}.hs small{font:700 10px/1.1 var(--hud);color:var(--ink3);text-shadow:none}
.rb{background:var(--panel);border:0;box-shadow:var(--edge),var(--soft);font:600 15px/1 var(--title);text-shadow:none}
#castBtn{background:rgba(255,200,74,.9);color:#3a2a08;box-shadow:inset 0 0 0 2px rgba(255,255,255,.4),var(--soft)}#actBtn{background:rgba(76,187,90,.9);box-shadow:var(--soft)}
#emoteMenu{border-radius:16px;background:var(--panel2);border:0;box-shadow:var(--edge),var(--soft);backdrop-filter:blur(10px)}

#chatLog{background:rgba(16,22,30,.45);border-radius:14px}.cl{font:700 13.5px/1.4 var(--hud)}

/* toasts and banners */
.toast{border-radius:999px;background:var(--panel2);border:0;box-shadow:var(--edge),var(--soft);backdrop-filter:blur(10px);padding:8px 18px;font:700 14px/1.4 var(--hud)}
.toast.gold{color:var(--gold2);box-shadow:inset 0 0 0 1.5px rgba(255,200,74,.6),var(--soft)}
#zoneBan{font:600 clamp(40px,6vw,66px)/1 var(--title);letter-spacing:.01em;text-transform:none;text-shadow:0 2px 0 rgba(0,0,0,.25),0 4px 24px rgba(0,0,0,.45)}
#zoneBan small{font:700 14px var(--hud);letter-spacing:.2em}
.story{border-radius:18px;background:var(--panel2);border:0;box-shadow:var(--edge),var(--soft);backdrop-filter:blur(10px);font:700 15px/1.5 var(--hud)}

#hook .hk-core{font:700 38px/1 var(--title);text-shadow:var(--stroke)}#hook small{font:700 13px var(--hud);letter-spacing:0;text-transform:none}
#hook .hk-ring{border:5px solid #fff;box-shadow:0 0 24px rgba(255,255,255,.4)}
.floatTip{font:700 30px var(--title);color:var(--gold2);text-shadow:var(--stroke)}#rfSteer{font:700 28px var(--title)}
/* catch card */
#catchCard{border-radius:20px;background:var(--panel2);border:0;box-shadow:var(--edge),inset 0 4px 0 var(--rc,#fff),var(--soft);backdrop-filter:blur(12px);padding:16px 28px}
.cc-new{background:var(--gold);color:#3a2a08;border:0;border-radius:999px;font:600 12px var(--title);letter-spacing:.06em;padding:2px 12px}
.cc-name{font:700 30px/1.05 var(--title)}.cc-stats{font:700 12px var(--hud);color:var(--ink2);letter-spacing:0;text-transform:none}.cc-stats b{font:700 24px var(--title);color:#fff}
.cc-q{font:700 12px var(--hud);color:var(--gold2)}
/* reel panel */
#reel{border-radius:20px;background:var(--panel2);border:0;box-shadow:var(--edge),var(--soft);backdrop-filter:blur(12px)}
#reel.big{box-shadow:var(--edge),0 0 0 2px var(--rc),0 0 26px -6px var(--rc),var(--soft)}
.reel-top{font:600 18px var(--title)}.rf-dist{font:700 32px/1 var(--title)}.rf-dist small{font:700 12px var(--hud)}
.rf-k,.rf-gauge .lbl{font:700 11px var(--hud);letter-spacing:.04em}
.rf-bar,.rf-line{height:9px;border-radius:999px}#rfStam{border-radius:999px}.reel-hint{font:700 13px var(--hud)}
/* panels */
#panelWrap{background:rgba(8,12,18,.35);backdrop-filter:blur(2px)}
#panel{border-radius:22px;background:var(--panel2);border:0;box-shadow:var(--edge),0 24px 60px -20px rgba(0,0,0,.7);backdrop-filter:blur(16px)}
.ph{background:none;border-bottom:1px solid var(--line);padding:16px 14px 12px 22px}
.ph h2{font:700 24px/1.1 var(--title)}.ph p{font:700 12px var(--hud);letter-spacing:0;text-transform:none;color:var(--ink2);margin-top:2px}
.ph .ib{width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.08);box-shadow:none;backdrop-filter:none}.ph .ib:hover{background:rgba(255,255,255,.16)}
.pb2{padding:16px 20px 22px;gap:10px}
.say{background:rgba(255,255,255,.07);border:0;border-radius:14px;padding:11px 14px;font:700 14.5px/1.5 var(--hud)}
.say .who{font:600 13px var(--title);letter-spacing:0;text-transform:none;color:var(--gold2);margin-bottom:2px}
.btn{border-radius:12px;padding:9px 18px;font:600 15px var(--title);letter-spacing:.01em;text-transform:none;color:#fff;text-shadow:none;background:var(--gold);color:#3a2a08;box-shadow:0 3px 0 rgba(0,0,0,.22);transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(1.07)}.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
.btn.sky{background:var(--blue);color:#fff}.btn.mint{background:var(--green);color:#fff}.btn.rose{background:var(--red);color:#fff}.btn.lav{background:var(--purple);color:#fff}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff;box-shadow:none}.btn.ghost:hover{background:rgba(255,255,255,.2)}
.btn.sm{padding:6px 13px;font-size:13.5px}.btn.lg{padding:12px 28px;font-size:17px}.btn[disabled]{opacity:.4;filter:grayscale(.6)}

.fmeta b,.dcard b{font:600 15.5px/1.15 var(--title)}.fval{font:600 17px var(--title);color:var(--gold2)}
.qbar,.sbar{height:8px;border-radius:999px;background:rgba(255,255,255,.12)}.qbar i,.sbar i{border-radius:999px}.qbar i{background:var(--gold)}
.muted{font:700 13.5px/1.45 var(--hud);color:var(--ink2)}.statg{font:700 12.5px var(--hud)}
.pill{background:var(--c);color:#1a1e26;border:0;border-radius:999px;font:600 11.5px/1.6 var(--title);letter-spacing:0;text-transform:none;padding:0 9px}

.ench{background:var(--c);color:#1a1e26;border:0;border-radius:999px;font:600 12px var(--title)}
.lk{border-radius:10px}.lbrow .rk{font:600 16px var(--title)}.lbrow .val{font:600 15px var(--title)}.lbrow.me{background:rgba(74,155,232,.18);box-shadow:inset 0 0 0 1.5px rgba(116,182,242,.6)}
.statrow{font:700 13.5px var(--hud)}
.thumb{border-radius:12px;background:radial-gradient(ellipse at 50% 60%,rgba(255,255,255,.14),rgba(0,0,0,.2));box-shadow:none}

input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:999px;background:linear-gradient(90deg,var(--gold) var(--p,50%),rgba(255,255,255,.16) var(--p,50%))}

/* screens */

.mm-title h1{font:700 clamp(50px,6.6vw,90px)/.92 var(--title);letter-spacing:.01em;text-transform:none;text-shadow:0 3px 0 rgba(0,0,0,.18),0 6px 30px rgba(0,0,0,.35)}
.mm-title p{font:600 clamp(13px,1.2vw,16px) var(--title);letter-spacing:.32em}
.mm-nav{gap:8px}.mm-nav button{font:600 clamp(19px,1.8vw,24px)/1.3 var(--title);letter-spacing:.02em;transition:color .15s,transform .15s}

#devBar .dv-h b{font:600 16px var(--title);text-transform:none;letter-spacing:0}#devBar button{border-radius:10px;font:600 13px var(--title);background:rgba(255,255,255,.12)}

/* =================================================================================================
   HUD STATS — chunky game style: big outlined numbers, a coin with a fish stamp, a level gem and a
   fat XP bar. Plus the Next rod tracker, the compass guide pin and the Rod path panel.
   ================================================================================================= */
:root{--olk:2px 0 0 #0d1117,-2px 0 0 #0d1117,0 2px 0 #0d1117,0 -2px 0 #0d1117,1.5px 1.5px 0 #0d1117,-1.5px 1.5px 0 #0d1117,1.5px -1.5px 0 #0d1117,-1.5px -1.5px 0 #0d1117,0 3.5px 0 rgba(0,0,0,.45);
 --olk1:1.3px 0 0 #0d1117,-1.3px 0 0 #0d1117,0 1.3px 0 #0d1117,0 -1.3px 0 #0d1117,1px 1px 0 #0d1117,-1px 1px 0 #0d1117,1px -1px 0 #0d1117,-1px -1px 0 #0d1117,0 2px 0 rgba(0,0,0,.4)}
.clock{font:600 15px var(--title);text-shadow:var(--olk1)}.clock small{font:600 12px var(--title);color:#dfe8f0;text-shadow:var(--olk1)}
#wallet{display:flex;flex-direction:column;align-items:flex-end;gap:5px;margin-top:6px}
.lvlRow{display:flex;align-items:center;gap:7px}
.lvlBadge{position:relative;width:42px;height:46px;flex:none;filter:drop-shadow(0 3px 0 rgba(0,0,0,.3))}
.lvlBadge svg{display:block;width:100%;height:100%}
.lvlBadge b{position:absolute;inset:0;display:grid;place-items:center;font:700 18px/1 var(--title);color:#fff;text-shadow:var(--olk1);padding-bottom:1px}
.xpCol{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
#lvlTxt{font:700 21px/1 var(--title);color:#fff;text-shadow:var(--olk);letter-spacing:.3px}
.xpbar{position:relative;width:172px;height:17px;border-radius:8px;background:#1b2330;box-shadow:0 0 0 2.5px #0d1117,0 3px 0 2.5px rgba(0,0,0,.3);overflow:hidden}
.xpbar i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(180deg,#a6f285 0,#62d65e 48%,#45b84d 52%,#56c95a 100%);transition:width .6s}
#xpTxt{position:absolute;inset:0;display:grid;place-items:center;font:600 11.5px/1 var(--title);color:#fff;text-shadow:var(--olk1);letter-spacing:.2px;font-variant-numeric:tabular-nums}
.coins{position:relative;display:flex;align-items:center;gap:7px;font:700 32px/1 var(--title);color:#ffdf5e;text-shadow:var(--olk);letter-spacing:.4px;font-variant-numeric:tabular-nums}
.coin{width:34px;height:34px;flex:none;background:none!important;box-shadow:none!important;border-radius:0;filter:drop-shadow(0 3px 0 rgba(0,0,0,.3))}
.coin svg{display:block;width:100%;height:100%}
#coinTxt{display:inline-block;transform-origin:100% 50%}
.coins.bump #coinTxt{animation:cbump .32s ease-out}
@keyframes cbump{40%{transform:scale(1.12)}}
.cpop{position:absolute;right:2px;bottom:100%;font:700 19px/1 var(--title);color:#8ff07a;text-shadow:var(--olk1);white-space:nowrap;pointer-events:none;animation:cpop 1.35s ease-out forwards}
.cpop.neg{color:#ff8f80}
@keyframes cpop{0%{opacity:0;transform:translateY(10px) scale(.7)}14%{opacity:1;transform:translateY(0) scale(1.1)}28%{transform:scale(1)}100%{opacity:0;transform:translateY(-30px)}}
#relicTxt{font:600 13px var(--title);color:#a8ecff;text-shadow:var(--olk1)}
/* the same crisp outline on the other floating HUD text */
#mmZone{font:600 15px var(--title);text-shadow:var(--olk1)}.mm .n{text-shadow:var(--olk1)}
#compassStrip{text-shadow:var(--olk1)}#compassStrip .t{opacity:.55}
.hs .k{color:#c9d3dc}.hs b{color:#fff}
/* hotbar: a gold dot when Mystery Crates are waiting */
.hs.crate::after{content:'';position:absolute;left:19px;top:7px;width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 2px rgba(16,22,30,.9);animation:dotp 1.6s ease-in-out infinite}
@keyframes dotp{50%{transform:scale(1.35)}}
.hs b{max-width:62px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* next rod tracker */
#nrWrap{top:calc(66px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px))}
#nextRod{display:grid;grid-template-columns:38px minmax(0,1fr);column-gap:10px;row-gap:1px;align-items:center;width:232px;padding:9px 11px 10px 9px;border:0;border-radius:16px;background:var(--panel);box-shadow:var(--edge),var(--soft);backdrop-filter:blur(8px);color:#fff;text-align:left;cursor:pointer;font:inherit;transition:background .2s,box-shadow .2s}
#nextRod[hidden]{display:none}
#nextRod:hover{background:rgba(32,42,56,.86)}#nextRod:active{transform:scale(.98)}
.nrI{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.08);flex:none}
.nrI svg{width:27px;height:27px}.nrI.big{width:50px;height:50px;border-radius:14px}.nrI.big svg{width:36px;height:36px}
#nextRod .nrI{grid-row:1/span 3}
#nextRod small{font:600 10.5px/1.1 var(--title);letter-spacing:1.1px;text-transform:uppercase;color:var(--ink3)}
#nextRod b{font:600 15px/1.15 var(--title);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nextRod em{font:700 11.5px/1.25 var(--hud);font-style:normal;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nrBar{grid-column:1/-1;position:relative;height:16px;margin-top:7px;border-radius:999px;background:rgba(0,0,0,.38);overflow:hidden}
.nrBar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,#f0ae36,#ffd76e);transition:width .5s}
.nrBar span{position:relative;display:grid;place-items:center;height:100%;font:600 11px/1 var(--title);text-shadow:0 1px 2px rgba(0,0,0,.7);font-variant-numeric:tabular-nums}
#nextRod.ready{box-shadow:inset 0 0 0 2px #7bd987,var(--soft)}#nextRod.ready small{color:#9be07a}
#nextRod.ready .nrBar i{background:linear-gradient(90deg,#4cbb5a,#9be07a)}
#nextRod.lock .nrBar i{background:rgba(255,255,255,.14)}#nextRod.lock em{color:#ffb4a6}
/* compass guide pin */
#guidePin{position:absolute;top:22px;left:50%;display:flex;align-items:center;gap:4px;padding:2px 8px 2px 5px;border-radius:999px;background:rgba(16,22,30,.78);box-shadow:inset 0 0 0 1.5px #ffd76e;pointer-events:none;white-space:nowrap}
#guidePin[hidden]{display:none}
#guidePin i{width:9px;height:9px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#ffd76e}
#guidePin small{font:600 11px/1.2 var(--title);color:#ffe9a8}
#guidePin.edge{box-shadow:inset 0 0 0 1.5px #ffb04a}#guidePin.edge i{background:#ffb04a}
/* rod path panel */
.rpLink{justify-content:space-between;align-items:center;margin:0 0 10px;gap:10px}
.rpTop{display:flex;align-items:center;gap:18px;margin:0 0 12px;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.05)}
.rpTop b{display:block;font:600 20px/1.1 var(--title)}.rpTop small{font:700 11px var(--hud);color:var(--ink3);text-transform:uppercase;letter-spacing:.8px}
.rpNext{margin-bottom:14px}.rpNext .row{align-items:center;gap:12px}.kick{display:block;font:700 10.5px var(--title);letter-spacing:1.1px;text-transform:uppercase;color:#9be07a;margin-bottom:1px}
.rpIsl{margin:0 0 14px}
.rpIsl h4{display:flex;align-items:center;gap:8px;margin:0 0 6px;padding:0 4px;font:600 14px var(--title);color:var(--ink2)}
.rpIsl h4 i{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px rgba(255,255,255,.15)}
.rpIsl h4 span{margin-left:auto;font:700 11px var(--hud);color:#ffb4a6}
.rpIsl.shut .rpRow{opacity:.62}
.rpRow{display:flex;align-items:center;gap:10px;padding:8px 10px;margin-bottom:5px;border-radius:12px;background:rgba(255,255,255,.045)}
.rpRow .grow{min-width:0}
.rpRow b{display:flex;align-items:center;gap:6px;font:600 14.5px/1.2 var(--title)}
.rpRow b em{font:600 10px/1 var(--title);font-style:normal;letter-spacing:.8px;text-transform:uppercase;color:#2a2008;background:#ffd76e;border-radius:999px;padding:3px 7px}
.rpRow small{display:block;font:700 11.5px/1.3 var(--hud);color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rpRow.next{background:rgba(255,215,110,.1);box-shadow:inset 0 0 0 1.5px rgba(255,215,110,.55)}
.rpRow.eq{background:rgba(76,187,90,.12)}
.rpR{display:flex;align-items:center;gap:8px;flex:none}
.tag{font:600 12px/1 var(--title);padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.08);white-space:nowrap;max-width:190px;overflow:hidden;text-overflow:ellipsis}
.tag.ok{color:#9be07a;background:rgba(76,187,90,.16)}.tag.own{color:#a6d4f7;background:rgba(74,155,232,.16)}.tag.lock{color:#ffb4a6;background:rgba(232,88,74,.14);font-size:11px}.tag.buy{color:#ffd76e;background:rgba(255,200,74,.14)}
@media (max-width:640px){
 .lvlBadge{width:32px;height:35px}.lvlBadge b{font-size:14px}#lvlTxt{font-size:16px}.xpbar{width:120px;height:13px}#xpTxt{font-size:9.5px}
 .coins{font-size:23px}.coin{width:25px;height:25px}
 #nrWrap{top:calc(96px + env(safe-area-inset-top,0px))}#nextRod{width:170px;padding:6px 8px 7px;grid-template-columns:28px minmax(0,1fr);column-gap:7px}#nextRod .nrI{width:28px;height:28px;border-radius:9px}#nextRod .nrI svg{width:21px;height:21px}#nextRod em{display:none}#nextRod b{font-size:13px}.nrBar{height:12px;margin-top:4px}.nrBar span{font-size:9.5px}
 .rpRow small{white-space:normal}.tag.lock{max-width:120px;white-space:normal;line-height:1.2}
}
@media (max-width:480px){#nrWrap{display:none}}
@media (max-width:640px){#tc{top:calc(160px + env(safe-area-inset-top,0px))}#feed{top:calc(222px + env(safe-area-inset-top,0px))}}
/* phones held upright: the touch buttons own the bottom right, so coins and level sit on the left above the joystick */
@media (max-width:640px){body:not(.desk) #br{left:calc(12px + env(safe-area-inset-left,0px));right:auto;bottom:calc(300px + env(safe-area-inset-bottom,0px));align-items:flex-start;text-align:left}body:not(.desk) #wallet,body:not(.desk) .xpCol{align-items:flex-start}body:not(.desk) .cpop{right:auto;left:30px}}

/* =================================================================================================
   STATS, simple game style (bottom right): a row of white status icons, "Level N" in warm cream,
   then the coin total in bold italic white. Esc opens the menu on PC, so the corner buttons go.
   ================================================================================================= */
#br{gap:2px}
#stIcons{display:flex;align-items:center;gap:8px;color:#f6f3ec;filter:drop-shadow(0 1px 1.2px rgba(0,0,0,.8)) drop-shadow(0 0 3px rgba(0,0,0,.35))}
#stIcons #clockTxt,#stIcons #wxTxt{display:none}
#stExtra,#clockIco{display:flex;align-items:center;gap:8px}
.si{display:grid;place-items:center;width:22px;height:22px;font-style:normal}
.si svg,#clockIco .si svg{width:22px;height:22px;filter:none}
.si.well{color:#63e2ff}.si.buff{color:#8cf27a}
#wallet{display:flex;flex-direction:column;align-items:flex-end;gap:0;margin-top:3px}
#lvlTxt{font:600 21px/1.2 'Nunito',system-ui,sans-serif;color:#efe2c4;letter-spacing:.2px;text-shadow:0 1px 0 rgba(0,0,0,.6),0 0 3px rgba(0,0,0,.75),0 2px 7px rgba(0,0,0,.35)}
.xpline{width:118px;height:2px;margin:1px 0 4px;border-radius:2px;background:rgba(255,255,255,.2);overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.4)}
.xpline i{display:block;height:100%;width:0;background:#efe2c4;transition:width .6s}
.coins{gap:0;font:italic 900 27px/1.1 'Nunito',system-ui,sans-serif;color:#fdfaf2;letter-spacing:.4px;text-shadow:0 1.5px 0 rgba(0,0,0,.65),0 0 4px rgba(0,0,0,.75),0 2px 9px rgba(0,0,0,.35)}
.coins .cur{margin-left:7px}
.cpop{font:italic 900 19px/1 'Nunito',system-ui,sans-serif;text-shadow:0 1px 0 rgba(0,0,0,.7),0 0 4px rgba(0,0,0,.8)}
#relicTxt{display:none}
/* PC: Esc is the menu. The corner buttons hide; their jobs live in the Esc menu (L, O and P still work) */
.desk #tr{display:none}
.desk #nrWrap{top:calc(12px + env(safe-area-inset-top,0px))}
#escTab{display:none;align-items:center;gap:7px;padding:3px 13px 3px 4px;border:0;border-radius:999px;background:rgba(14,20,28,.45);color:#f6f3ec;font:700 13px/1.2 'Nunito',system-ui,sans-serif;cursor:pointer;text-shadow:0 1px 2px rgba(0,0,0,.6);transition:background .2s}
.desk #escTab{display:flex}
#escTab kbd{font:800 11px/1.3 'Nunito',system-ui,sans-serif;padding:1px 6px;border-radius:6px;background:rgba(255,255,255,.2);color:#fff}
#escTab:hover{background:rgba(14,20,28,.72)}
.si.relic{width:auto;display:flex;align-items:center;gap:3px;color:#5fd6ff;cursor:pointer}.si.relic b{font:800 13px/1 'Nunito',system-ui,sans-serif;color:#fff;font-style:normal}
.rxHead .row{align-items:center;gap:12px}.rxGem{display:grid;place-items:center;width:46px;height:46px;border-radius:14px;background:rgba(95,214,255,.14);color:#5fd6ff}.rxGem svg{width:28px;height:28px}
.dcard .btn{margin-top:6px}
@media (max-width:640px){#lvlTxt{font-size:16px}.coins{font-size:21px}.si,.si svg,#clockIco .si svg{width:18px;height:18px}.xpline{width:90px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="Driftwood Isles game view"></canvas>
<div id="loading"><div class="ld"><h1>Driftwood Isles</h1><div class="bar"><i id="ldFill"></i></div><small id="ldMsg">Loading the islands…</small></div></div>

<div class="hud" id="tl">
  <div class="mm" id="mmBtn" title="Map (M)"><canvas id="minimap" width="336" height="336"></canvas><span class="n">N</span></div>
  <span id="mmZone">Pebble Cove</span>
  <div id="buffBar"></div>
</div>
<div class="hud" id="tc">
  <div id="compass"><div id="compassStrip"></div></div>
  <div id="guidePin" hidden><i></i><small></small></div>
  <button id="escTab" type="button" title="Open the menu"><kbd>Esc</kbd>Menu</button>
  <div id="eventBan" hidden></div>
</div>
<div class="hud" id="tr">
  <button class="ib" id="lbBtn" title="Leaderboards (L)" aria-label="Leaderboards"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8.5 20h7"/></svg></button>
  <button class="ib" id="onBtn" title="Players online (O)" aria-label="Players online"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8.5" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="9.5" r="2.4"/><path d="M16 14.2c2.4-.2 4.1 1.4 4.6 4"/></svg><span class="badge off" id="onCount">1</span></button>
  <button class="ib mob-only" id="chatBtn" title="Chat" aria-label="Chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 6.5a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H10l-4 3.5v-3.5h0a2 2 0 0 1-1.5-2z"/></svg><span class="badge" id="chatBadge" hidden>•</span></button>
  <button class="ib" id="photoBtn" title="Photo mode (P)" aria-label="Photo mode"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5a2 2 0 0 1 2-2h2l1.5-2h5L16 6.5h2a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><circle cx="12" cy="12.5" r="3.5"/></svg></button>
  <button class="ib" id="setBtn" title="Menu (Esc)" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h14"/></svg></button>
</div>
<div class="hud" id="nrWrap"><button id="nextRod" type="button" hidden aria-label="Next rod"></button></div>
<div class="hud" id="br">
  <div class="clock" id="stIcons"><span id="stExtra"></span><span id="clockIco"></span><span id="clockTxt">06:00</span><small id="wxTxt">Clear</small></div>
  <div id="wallet">
   <div id="lvlTxt">Level 1</div>
   <div class="xpline"><i id="xpFill"></i></div>
   <div class="coins"><span id="coinTxt">0</span><span class="cur">c</span></div>
   <span id="relicTxt"></span><span id="lvlNum" hidden></span><span id="xpTxt" hidden></span>
  </div>
</div>
<div class="hud" id="bottom">
  <div id="power" hidden><div class="pl"><span>Cast power</span><span id="powTxt">0%</span></div><div class="pb"><i id="powFill"></i></div></div>
  <div id="prompt" hidden></div>
  <div id="gear"></div>
  <div id="hotbar">
    <button class="hs" id="hbRod" data-k="1"><span class="k">1</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 20 19 5"/><path d="M19 5v9"/><circle cx="19" cy="15.5" r="1.4"/><circle cx="7" cy="17" r="2.2"/></svg><b id="hbRodN">Rod</b><small id="hbRodS"></small></button>
    <button class="hs" id="hbBait" data-k="2"><span class="k">2</span><span class="q" id="hbBaitQ"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v7a4 4 0 1 1-4 4"/><circle cx="12" cy="3" r="1"/></svg><b id="hbBaitN">Bait</b><small id="hbBaitS"></small></button>
    <button class="hs" id="bagBtn" data-k="3"><span class="k">3</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 8.5h13l-1 11.5h-11z"/><path d="M9 8.5V7a3 3 0 0 1 6 0v1.5"/></svg><b>Backpack</b><small id="hbBagS">0/20</small></button>
    <button class="hs" id="dexBtn" data-k="4"><span class="k">4</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5C10 5 7 4.5 4 5v13c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5V5c-3-.5-6 0-8 1.5z"/><path d="M12 6.5v13"/></svg><b>Bestiary</b><small id="hbDexS">0</small></button>
    <button class="hs" id="questBtn" data-k="5"><span class="k">5</span><span class="q" id="hbQuestQ"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l3 3v15H6z"/><path d="M9 9h6M9 13h6M9 17h4"/></svg><b>Quests</b><small id="hbQuestS">None</small></button>
    <button class="hs" id="emoteBtn" data-k="6"><span class="k">6</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 14.5c1 1.4 2.1 2 3.5 2s2.5-.6 3.5-2"/><path d="M9 9.5h.01M15 9.5h.01" stroke-width="3"/></svg><b>Emotes</b><small>Wave · dance</small></button>
    <button class="hs" id="statBtn" data-k="7"><span class="k">7</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M5 20V11M10 20V5M15 20v-7M20 20V8"/></svg><b>Stats</b><small>Buffs</small></button>
    <button class="hs" id="mapBtn" data-k="8"><span class="k">8</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6.5v13L9 17l6 2.5 6-2.5V4l-6 2.5z"/><path d="M9 4v13M15 6.5v13"/></svg><b>Map</b><small id="hbMapS">Isles</small></button>
  </div>
</div>
<div class="hud" id="ctrls">
  <div class="col">
    <div class="camrot"><button class="rb" id="camL" aria-label="Rotate camera left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7H5V3"/><path d="M5.5 7A8 8 0 1 1 4 12"/></svg></button><button class="rb" id="camR" aria-label="Rotate camera right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 7h4V3"/><path d="M18.5 7A8 8 0 1 0 20 12"/></svg></button></div>
    <button class="rb" id="jumpBtn">Jump</button>
  </div>
  <div class="col">
    <button class="rb" id="actBtn" hidden>Talk</button>
    <button class="rb" id="castBtn">CAST</button>
  </div>
</div>
<div class="hud" id="joy"><i></i></div>
<div id="chat">
  <div id="chatLog" aria-live="polite"></div>
  <form id="chatForm" autocomplete="off"><input id="chatIn" maxlength="140" placeholder="Press Enter to chat" aria-label="Chat message"><button id="chatSend" type="submit">Send</button><button class="ib" id="chatClear" type="button" title="Clear chat (/clear)" aria-label="Clear chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12M10.5 11v5M13.5 11v5"/></svg></button><button class="ib" id="chatClose" type="button" aria-label="Close chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></form>
</div>
<div id="devBar" hidden></div>
