<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c2329">
<title>Driftwood Isles</title>
<meta name="description" content="Driftwood Isles: a cozy multiplayer fishing game.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap">
<style>
/* Layout: full-bleed 3D world; soft frosted-glass HUD pieces float in the corners, panels rise from the centre. One pastel daylight look by design. */
:root{
  --ink:#33405a; --ink2:#5d6984; --ink3:#8b95ab;
  --glass:rgba(255,253,249,.72); --glass2:rgba(255,253,249,.93); --edge:rgba(255,255,255,.85);
  --sh:0 12px 32px -10px rgba(36,56,90,.32),0 2px 6px rgba(36,56,90,.08);
  --peach:#ffd2bd; --peach2:#f39d7c; --mint:#bdeed8; --mint2:#4fb98c; --sky:#c4e4fb; --sky2:#56a3dd;
  --lav:#dfd3fe; --lav2:#8f74e6; --butter:#ffe9a8; --butter2:#eeb43c; --rose:#ffd3e0; --rose2:#e77b9f;
  --display:'Fredoka','Nunito',system-ui,sans-serif; --body:'Nunito',system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;overflow:hidden;background:#a9d8f2;}
[hidden]{display:none!important;}
body{font-family:var(--body);color:var(--ink);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;}
button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px;box-shadow:0 0 0 4px var(--sky2);}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(1.35);backdrop-filter:blur(14px) saturate(1.35);border:1px solid var(--edge);box-shadow:var(--sh);}
body.lowfx .glass{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--glass2);}
.hud{position:fixed;z-index:10;pointer-events:none;transition:opacity .4s;}
.hud>*{pointer-events:auto;}
body.photo .hud,body.photo #toasts,body.photo #feed,body.photo #catchCard{opacity:0;pointer-events:none!important;}
body.photo .hud>*{pointer-events:none!important;}
body.joining .hud{opacity:0;pointer-events:none;}
body.joining .hud>*{pointer-events:none;}
/* stats */
#stats{top:calc(12px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;align-items:flex-start;}
.coins{display:flex;align-items:center;gap:9px;padding:7px 16px 7px 8px;border-radius:999px;font:600 21px/1 var(--display);font-variant-numeric:tabular-nums;}
.coin{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fffbe0,#ffd65c 45%,#e6a62a);box-shadow:inset 0 -2px 0 rgba(160,100,10,.35),0 1px 2px rgba(120,80,10,.3);flex:none;}
.lvl{padding:8px 14px 10px;border-radius:16px;min-width:178px;}
.lvl-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font:600 15px/1.2 var(--display);}
.relics{font:600 12px var(--display);color:var(--lav2);}
.xpbar{height:7px;border-radius:9px;background:rgba(51,64,90,.1);margin-top:6px;overflow:hidden;}
.xpbar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,#9fe0c0,#7cd3a6);transition:width .6s cubic-bezier(.2,.8,.2,1);}
/* top right */
#topr{top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:flex-end;gap:8px;max-width:calc(100vw - 210px);}
.clock{display:flex;align-items:center;gap:9px;padding:7px 14px 7px 10px;border-radius:999px;font:500 16px/1 var(--display);font-variant-numeric:tabular-nums;}
.clock svg{width:20px;height:20px;}
.clock small{font:800 11px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--ink2);}
.tray{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end;}
.ib{position:relative;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink2);transition:transform .18s cubic-bezier(.2,.9,.3,1.4),background .2s;}
.ib:hover{transform:translateY(-2px);color:var(--ink);}
.ib:active{transform:scale(.92);}
.ib svg{width:22px;height:22px;}
.ib .badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--mint2);color:#fff;font:600 11px/18px var(--display);text-align:center;box-shadow:0 2px 5px rgba(30,90,60,.3);box-sizing:border-box;}
.ib .badge.off{background:var(--ink3);}
.desk .mob-only{display:none!important;}
/* event + zone */
#eventBan{top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);padding:7px 18px;border-radius:999px;text-align:center;font:600 15px/1.2 var(--display);white-space:nowrap;max-width:calc(100vw - 32px);animation:drop .5s cubic-bezier(.2,.9,.3,1.2);}
#eventBan small{display:block;font:700 12px var(--body);color:var(--ink2);}
#eventBan i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:1px;background:var(--ev,#f0bb45);box-shadow:0 0 0 4px rgba(255,255,255,.6);}
@media (max-width:640px){#eventBan{top:auto;bottom:calc(150px + env(safe-area-inset-bottom,0px));}}
#zoneBan{position:fixed;z-index:9;top:20%;left:50%;transform:translate(-50%,8px);font:600 clamp(36px,6.4vw,64px)/1 var(--display);color:#fff;text-shadow:0 4px 24px rgba(30,50,80,.35),0 2px 3px rgba(30,50,80,.25);opacity:0;transition:opacity .9s,transform .9s;pointer-events:none;text-align:center;white-space:nowrap;letter-spacing:.01em;}
#zoneBan small{display:block;font:800 14px var(--body);margin-top:8px;letter-spacing:.22em;text-transform:uppercase;opacity:.9;}
#zoneBan.show{opacity:1;transform:translate(-50%,0);}
body.photo #zoneBan,body.joining #zoneBan{opacity:0;}
/* bottom centre */
#bottom{bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;width:min(480px,calc(100vw - 260px));min-width:200px;}
#prompt{padding:8px 16px 8px 9px;border-radius:999px;font:500 16px var(--display);display:flex;align-items:center;gap:9px;white-space:nowrap;animation:rise .25s ease-out;}
#prompt kbd{background:#fff;border-radius:8px;padding:2px 9px;font:600 14px var(--display);box-shadow:0 2px 0 rgba(51,64,90,.15);}
#gear{padding:5px 14px;border-radius:999px;font:600 13px var(--display);color:var(--ink2);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;}
#power{width:min(300px,70vw);padding:8px 12px 10px;border-radius:16px;}
#power .pl{display:flex;justify-content:space-between;font:600 13px var(--display);color:var(--ink2);}
#power .pb{height:12px;border-radius:9px;background:rgba(51,64,90,.1);overflow:hidden;margin-top:5px;}
#power .pb i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,#9fe0c0,#ffe08a 60%,#ffab8a);}
/* right controls */
#ctrls{right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:auto auto;align-items:end;gap:12px;}
#ctrls .col{display:flex;flex-direction:column;align-items:center;gap:12px;}
.rb{border-radius:50%;display:grid;place-items:center;font:600 16px/1 var(--display);touch-action:none;transition:transform .15s cubic-bezier(.2,.9,.3,1.4),box-shadow .15s;color:var(--ink);}
.rb:active,.rb.on{transform:scale(.93);}
#castBtn{width:92px;height:92px;font-size:19px;background:radial-gradient(circle at 50% 30%,#fff8de,var(--butter) 60%,#ffd77a);box-shadow:inset 0 2px 0 #fff,0 10px 24px -8px rgba(200,140,30,.6),0 0 0 5px rgba(255,255,255,.45);}
#jumpBtn{width:60px;height:60px;font-size:13px;background:radial-gradient(circle at 50% 30%,#f4fbff,var(--sky));box-shadow:inset 0 2px 0 #fff,0 8px 18px -8px rgba(60,120,180,.55),0 0 0 4px rgba(255,255,255,.4);}
#emoteBtn{width:50px;height:50px;background:radial-gradient(circle at 50% 30%,#fbf8ff,var(--lav));box-shadow:inset 0 2px 0 #fff,0 8px 18px -8px rgba(110,80,200,.5),0 0 0 4px rgba(255,255,255,.4);}
#emoteBtn svg{width:24px;height:24px;color:var(--lav2);}
#actBtn{min-width:84px;height:48px;border-radius:999px;padding:0 18px;background:linear-gradient(180deg,#eafcf3,var(--mint));box-shadow:inset 0 2px 0 #fff,0 8px 18px -8px rgba(40,140,100,.55);font-size:16px;}
.camrot{display:flex;gap:6px;padding:4px;border-radius:999px;}
.camrot .rb{width:40px;height:40px;background:rgba(255,255,255,.6);}
.camrot svg{width:20px;height:20px;color:var(--ink2);}
.desk #jumpBtn,.desk #actBtn,.desk .camrot{display:none;}
/* joystick */
#joy{left:calc(22px + env(safe-area-inset-left,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:132px;height:132px;border-radius:50%;background:rgba(255,255,255,.22);border:1.5px solid rgba(255,255,255,.7);box-shadow:inset 0 0 30px rgba(255,255,255,.25);touch-action:none;}
#joy i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:radial-gradient(circle at 50% 30%,#fff,#eef3fa);box-shadow:0 6px 14px -4px rgba(36,56,90,.35);transition:transform .08s;}
.desk #joy{display:none;}
/* emote menu */
#emoteMenu{position:fixed;z-index:15;right:calc(120px + env(safe-area-inset-right,0px));bottom:calc(90px + env(safe-area-inset-bottom,0px));padding:8px;border-radius:22px;display:grid;grid-template-columns:repeat(2,1fr);gap:6px;animation:rise .2s ease-out;}
#emoteMenu button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 14px;border-radius:16px;font:600 13px var(--display);color:var(--ink);transition:background .15s;}
#emoteMenu button:hover{background:rgba(255,255,255,.75);}
#emoteMenu svg{width:26px;height:26px;color:var(--lav2);}
#emoteMenu kbd{font:700 10px var(--body);color:var(--ink3);}
body:not(.desk) #emoteMenu kbd{display:none;}
/* chat */
#chat{left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(340px,30vw);display:flex;flex-direction:column;gap:6px;}
#chatLog{display:flex;flex-direction:column;gap:4px;max-height:200px;overflow-y:auto;scrollbar-width:none;transition:opacity .6s;-webkit-mask-image:linear-gradient(transparent,#000 22px);mask-image:linear-gradient(transparent,#000 22px);padding-top:18px;}
#chatLog::-webkit-scrollbar{display:none;}
#chat.idle #chatLog{opacity:0;}
#chat.idle:hover #chatLog,#chat:focus-within #chatLog{opacity:1;}
.cl{align-self:flex-start;max-width:100%;padding:4px 10px;border-radius:12px;background:rgba(255,253,249,.8);font:700 13px/1.35 var(--body);color:var(--ink);box-shadow:0 2px 8px -4px rgba(36,56,90,.3);overflow-wrap:anywhere;box-sizing:border-box;}
.cl b{font-weight:800;margin-right:5px;}
.cl.sys{background:rgba(255,253,249,.62);color:var(--ink2);font-style:italic;}
.cl.feed{background:linear-gradient(90deg,rgba(255,240,196,.96),rgba(255,253,249,.86));}
#chatForm{display:flex;gap:6px;}
#chatIn{flex:1;min-width:0;border:0;border-radius:999px;padding:9px 14px;font:700 14px var(--body);color:var(--ink);background:var(--glass2);box-shadow:var(--sh);outline:none;}
#chatIn::placeholder{color:var(--ink3);}
#chatSend{padding:0 14px;border-radius:999px;font:600 14px var(--display);background:linear-gradient(180deg,#f2f9ff,var(--sky));box-shadow:var(--sh);}
#chatClose{display:none;width:38px;height:38px;}
body:not(.desk) #chat{display:none;}
body:not(.desk) #chat.open{display:flex;left:12px;right:12px;width:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:45;padding:12px;border-radius:22px;background:var(--glass2);box-shadow:var(--sh);}
body:not(.desk) #chat.open #chatLog{max-height:38vh;opacity:1;}
body:not(.desk) #chat.open #chatClose{display:grid;}
/* feed */
#feed{position:fixed;z-index:12;left:calc(12px + env(safe-area-inset-left,0px));top:calc(118px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px;pointer-events:none;width:min(330px,calc(100vw - 32px));transition:opacity .4s;}
.fd{display:flex;align-items:center;gap:9px;padding:8px 12px;border-radius:14px;font:700 13px/1.3 var(--body);animation:slideIn .45s cubic-bezier(.2,.9,.3,1.2);}
.fd .dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--c);box-shadow:0 0 0 3px rgba(255,255,255,.7);}
.fd.out{animation:fadeOut .5s forwards;}
@keyframes slideIn{from{transform:translateX(-24px);opacity:0}}
@keyframes fadeOut{to{transform:translateX(-12px);opacity:0}}
/* shake */
#shakeLayer{position:fixed;inset:0;z-index:20;pointer-events:none;}
.shake{position:absolute;width:98px;height:98px;margin:-49px 0 0 -49px;border-radius:50%;pointer-events:auto;border:3px solid rgba(255,255,255,.95);background:radial-gradient(circle,rgba(255,255,255,.18) 42%,rgba(255,226,160,.5) 72%,rgba(255,255,255,.12));box-shadow:0 0 0 7px rgba(255,255,255,.16),0 10px 28px -6px rgba(36,56,90,.35);display:grid;place-items:center;animation:shakeIn .3s cubic-bezier(.2,1.5,.4,1),float 1.6s ease-in-out infinite .3s;touch-action:none;}
.shake.chill{width:122px;height:122px;margin:-61px 0 0 -61px;}
.shake::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid rgba(255,255,255,.8);animation:ring 1.4s ease-out infinite;pointer-events:none;}
.shake span{font:600 16px var(--display);color:#fff;letter-spacing:.06em;text-shadow:0 1px 6px rgba(36,56,90,.45);pointer-events:none;}
.shake.pop{animation:pop .3s ease-out forwards;}
.shake.fade{animation:fade .35s forwards;}
@keyframes shakeIn{from{transform:scale(.3);opacity:0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes ring{from{transform:scale(1);opacity:.8}to{transform:scale(1.5);opacity:0}}
@keyframes pop{to{transform:scale(1.6);opacity:0}}
@keyframes fade{to{transform:scale(.7);opacity:0}}
/* reel */
#reelCatch{position:fixed;inset:0;z-index:24;touch-action:none;}
#reel{position:fixed;z-index:25;left:50%;bottom:calc(128px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(560px,calc(100vw - 32px));padding:12px 14px 12px;border-radius:22px;pointer-events:none;box-sizing:border-box;}
.reel-top{display:flex;justify-content:space-between;align-items:center;font:600 16px var(--display);margin-bottom:8px;}
.reel-track{position:relative;height:46px;border-radius:15px;background:linear-gradient(180deg,#86c6f0,#5a9fd6);box-shadow:inset 0 3px 8px rgba(20,60,110,.35);overflow:hidden;transition:box-shadow .3s;}
.reel-track::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 46px,rgba(255,255,255,.08) 46px 48px);}
#reelBar{position:absolute;top:4px;bottom:4px;border-radius:11px;background:rgba(255,255,255,.3);border:2px solid rgba(255,255,255,.95);box-sizing:border-box;transition:background .2s,box-shadow .2s;}
#reelBar.in{background:rgba(190,250,215,.55);box-shadow:0 0 18px rgba(190,255,220,.8);}
#reelFish{position:absolute;top:50%;width:42px;height:28px;transform:translate(-50%,-50%);z-index:2;filter:drop-shadow(0 2px 3px rgba(10,40,80,.35));}
.reel-prog{height:11px;margin-top:9px;border-radius:9px;background:rgba(51,64,90,.1);overflow:hidden;}
#reelFill{height:100%;width:30%;border-radius:9px;background:linear-gradient(90deg,#ffb59a,#ffe08a 50%,#8fdcb6);}
.reel-hint{font:700 12px var(--body);color:var(--ink2);text-align:center;margin-top:7px;}
/* catch card */
#catchCard{position:fixed;z-index:30;left:50%;bottom:calc(70px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);min-width:270px;max-width:calc(100vw - 32px);padding:14px 22px 16px;border-radius:24px;text-align:center;animation:cardIn .5s cubic-bezier(.2,1.4,.4,1);border-top:4px solid var(--rc,#fff);box-sizing:border-box;cursor:pointer;}
@keyframes cardIn{from{transform:translate(-50%,24px) scale(.9);opacity:0}}
.cc-new{display:inline-block;background:linear-gradient(90deg,var(--peach),var(--rose));color:var(--ink);font:600 11px var(--display);letter-spacing:.14em;padding:3px 11px;border-radius:999px;margin-bottom:6px;}
.cc-name{font:600 27px/1.1 var(--display);text-wrap:balance;}
.cc-tags{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:8px 0;}
.cc-stats{display:flex;gap:22px;justify-content:center;font:700 13px var(--body);color:var(--ink2);font-variant-numeric:tabular-nums;}
.cc-stats b{display:block;font:600 22px var(--display);color:var(--ink);}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font:600 12px/1.45 var(--display);letter-spacing:.02em;background:var(--c);color:var(--ink);white-space:nowrap;}
.pill.secret{background:linear-gradient(90deg,#2e3242,#54477c,#2e3242);color:#fff;}
.pill.exotic{background:linear-gradient(90deg,#dccbff,#ffd0ef,#c7ebff);}
/* toasts */
#toasts{position:fixed;z-index:50;left:50%;top:calc(66px + env(safe-area-inset-top,0px));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:min(520px,calc(100vw - 32px));}
.toast{padding:8px 16px;border-radius:999px;font:700 14px/1.35 var(--body);text-align:center;max-width:100%;box-sizing:border-box;animation:drop .35s cubic-bezier(.2,.9,.3,1.2);transition:opacity .45s,transform .45s;}
.toast.gold{background:linear-gradient(90deg,#fff3c8,#ffe1a0);}
.toast.out{opacity:0;transform:translateY(-6px);}
@keyframes drop{from{transform:translateY(-10px);opacity:0}}
@keyframes rise{from{transform:translateY(10px);opacity:0}}
/* panel */
#panelWrap{position:fixed;inset:0;z-index:40;background:rgba(40,60,90,.3);display:grid;place-items:center;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(14px + env(safe-area-inset-bottom,0px));animation:fadeIn .25s;}
@keyframes fadeIn{from{opacity:0}}
#panel{width:min(620px,100%);max-height:100%;display:flex;flex-direction:column;border-radius:28px;overflow:hidden;background:rgba(255,253,249,.97);animation:panelIn .4s cubic-bezier(.2,1.1,.3,1);}
@keyframes panelIn{from{transform:translateY(18px) scale(.97);opacity:0}}
.ph{display:flex;align-items:center;gap:12px;padding:16px 16px 10px 22px;}
.ph h2{margin:0;font:600 25px/1.1 var(--display);text-wrap:balance;}
.ph p{margin:3px 0 0;font:700 13px var(--body);color:var(--ink2);}
.ph .ib{margin-left:auto;flex:none;background:rgba(51,64,90,.06);}
.pb2{padding:6px 18px 20px;overflow:auto;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch;}
.say{background:#fff;border-radius:18px 18px 18px 6px;padding:10px 14px;font:700 15px/1.45 var(--body);box-shadow:0 2px 10px -4px rgba(36,56,90,.2);}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.grow{flex:1;min-width:0;}
.btn{border-radius:999px;padding:9px 18px;font:600 15px var(--display);color:var(--ink);white-space:nowrap;background:linear-gradient(180deg,#fff8e2,var(--butter));box-shadow:inset 0 1px 0 #fff,0 6px 14px -7px rgba(200,140,30,.7);transition:transform .15s cubic-bezier(.2,.9,.3,1.4),filter .15s;}
.btn:hover{transform:translateY(-1px);filter:brightness(1.03);}
.btn:active{transform:scale(.96);}
.btn.mint{background:linear-gradient(180deg,#effdf6,var(--mint));box-shadow:inset 0 1px 0 #fff,0 6px 14px -7px rgba(40,140,100,.7);}
.btn.sky{background:linear-gradient(180deg,#f3faff,var(--sky));box-shadow:inset 0 1px 0 #fff,0 6px 14px -7px rgba(50,120,190,.7);}
.btn.lav{background:linear-gradient(180deg,#faf7ff,var(--lav));box-shadow:inset 0 1px 0 #fff,0 6px 14px -7px rgba(110,80,200,.7);}
.btn.rose{background:linear-gradient(180deg,#fff5f8,var(--rose));box-shadow:inset 0 1px 0 #fff,0 6px 14px -7px rgba(200,80,120,.7);}
.btn.ghost{background:rgba(51,64,90,.06);box-shadow:none;}
.btn.sm{padding:6px 13px;font-size:14px;}
.btn.lg{padding:12px 30px;font-size:18px;}
.btn[disabled]{opacity:.45;filter:grayscale(.6);cursor:not-allowed;transform:none;}
.tabs{display:flex;gap:3px;flex-wrap:wrap;background:rgba(51,64,90,.06);padding:4px;border-radius:20px;align-self:flex-start;max-width:100%;box-sizing:border-box;}
.tab{padding:6px 14px;border-radius:999px;font:600 14px var(--display);color:var(--ink2);transition:background .2s,color .2s;}
.tab.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px -2px rgba(36,56,90,.2);}
.list{display:flex;flex-direction:column;gap:8px;}

.cl{background:rgba(16,20,24,.72);color:var(--ink)}.cl.sys{background:rgba(16,20,24,.55);color:var(--ink2)}.cl.feed{background:rgba(74,60,34,.85)}.cl b{filter:brightness(1.6)}
#chatIn{background:var(--glass2);color:var(--ink);border:1px solid var(--edge)}#chatSend{background:rgba(201,168,106,.18);color:var(--brass2);border:1px solid rgba(201,168,106,.5)}
#join{background:var(--glass2);border:1px solid rgba(201,168,106,.28)}#join .fl{color:var(--brass)}#nameIn{background:rgba(255,255,255,.06);color:var(--ink);box-shadow:inset 0 0 0 1px var(--edge)}
.hat{background:rgba(255,255,255,.06);color:var(--ink2)}.hat.on{background:rgba(201,168,106,.2);color:var(--brass2);box-shadow:0 0 0 1px var(--brass)}.sw2{box-shadow:0 0 0 2px rgba(255,255,255,.2)}.sw2.on{box-shadow:0 0 0 2px #16191c,0 0 0 4px var(--brass)}
#photoBar b{color:var(--ink)}
.shake{background:rgba(16,20,24,.25);border-color:rgba(226,197,140,.95)}.shake span{color:var(--brass2)}
#loading{background:linear-gradient(180deg,#1c2329,#2c363d 60%,#3a3a34)}.ld small{color:var(--brass)}
#eventBan.big{border:1px solid var(--ev,#c9a86a);box-shadow:0 0 0 1px var(--ev,#c9a86a),0 0 26px -6px var(--ev,#c9a86a),var(--sh);font-size:16px}
#eventBan.big i{animation:evPulse 1.6s ease-in-out infinite}@keyframes evPulse{50%{box-shadow:0 0 0 7px rgba(255,255,255,.15)}}
</style>
</head>
<body>

<canvas id="c" tabindex="0" aria-label="Driftwood Isles game view"></canvas>
<div id="loading"><div class="ld"><h1>Driftwood Isles</h1><div class="bar"><i id="ldFill"></i></div><small id="ldMsg">Loading the islands…</small></div></div>

<div class="hud" id="stats">
  <div class="glass coins"><span class="coin"></span><span id="coinTxt">0</span></div>
  <div class="glass lvl"><div class="lvl-top"><span id="lvlTxt">Level 1</span><span class="relics" id="relicTxt"></span></div><div class="xpbar"><i id="xpFill"></i></div></div>
  <div id="buffBar"></div>
</div>
<div class="hud" id="topr">
  <div class="glass clock"><span id="clockIco"></span><span id="clockTxt">06:00</span><small id="wxTxt">Clear</small></div>
  <div class="tray">
    <button class="ib glass" id="bagBtn" title="Bag (B)" aria-label="Bag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 8.5h13l-1 11.5h-11z"/><path d="M9 8.5V7a3 3 0 0 1 6 0v1.5"/></svg></button>
    <button class="ib glass" id="dexBtn" title="Bestiary (G)" aria-label="Bestiary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5C10 5 7 4.5 4 5v13c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5V5c-3-.5-6 0-8 1.5z"/><path d="M12 6.5v13"/></svg></button>
    <button class="ib glass" id="lbBtn" title="Leaderboards (L)" aria-label="Leaderboards"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8.5 20h7"/></svg></button>
    <button class="ib glass" id="statBtn" title="Stats and buffs (K)" aria-label="Stats and buffs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 20V11M10 20V5M15 20v-7M20 20V8"/></svg></button>
    <button class="ib glass" id="onBtn" title="Online now (O)" aria-label="Online now"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8.5" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="9.5" r="2.4"/><path d="M16 14.2c2.4-.2 4.1 1.4 4.6 4"/></svg><span class="badge off" id="onCount">1</span></button>
    <button class="ib glass mob-only" id="chatBtn" title="Chat" aria-label="Chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 6.5a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H10l-4 3.5v-3.5h0a2 2 0 0 1-1.5-2z"/></svg><span class="badge" id="chatBadge" hidden>•</span></button>
    <button class="ib glass" id="photoBtn" title="Photo mode (P)" aria-label="Photo mode"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5a2 2 0 0 1 2-2h2l1.5-2h5L16 6.5h2a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><circle cx="12" cy="12.5" r="3.5"/></svg></button>
    <button class="ib glass" id="setBtn" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
  </div>
</div>
<div class="hud glass" id="eventBan" hidden></div>
<div id="zoneBan"></div>
<div class="hud" id="bottom">
  <div class="glass" id="power" hidden><div class="pl"><span>Cast power</span><span id="powTxt">0%</span></div><div class="pb"><i id="powFill"></i></div></div>
  <div class="glass" id="prompt" hidden></div>
  <div class="glass" id="gear"></div>
  <div id="hotbar"></div>
</div>
<div class="hud" id="ctrls">
  <div class="col">
    <div class="glass camrot"><button class="rb" id="camL" aria-label="Rotate camera left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7H5V3"/><path d="M5.5 7A8 8 0 1 1 4 12"/></svg></button><button class="rb" id="camR" aria-label="Rotate camera right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 7h4V3"/><path d="M18.5 7A8 8 0 1 0 20 12"/></svg></button></div>
    <button class="rb" id="emoteBtn" title="Emotes (1–4)" aria-label="Emotes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 14.5c1 1.4 2.1 2 3.5 2s2.5-.6 3.5-2"/><path d="M9 9.5h.01M15 9.5h.01" stroke-width="3"/></svg></button>
    <button class="rb" id="jumpBtn">Jump</button>
  </div>
  <div class="col">
    <button class="rb" id="actBtn" hidden>Talk</button>
    <button class="rb" id="castBtn">Cast</button>
  </div>
</div>
<div class="hud" id="joy"><i></i></div>
<div class="hud" id="chat">
  <div id="chatLog" aria-live="polite"></div>
  <form id="chatForm" autocomplete="off"><input id="chatIn" maxlength="140" placeholder="Press Enter to chat" aria-label="Chat message"><button id="chatSend" type="submit">Send</button><button class="ib" id="chatClose" type="button" aria-label="Close chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></form>
</div>
<div class="glass" id="emoteMenu" hidden>
  <button data-emote="wave"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V6.5a1.5 1.5 0 0 1 3 0V12M11 11V5a1.5 1.5 0 0 1 3 0v6M14 11V6.5a1.5 1.5 0 0 1 3 0V14a6 6 0 0 1-6 6h-.5a6 6 0 0 1-5-2.7L4 15a1.5 1.5 0 0 1 2.4-1.8L8 15"/></svg>Wave<kbd>1</kbd></button>
  <button data-emote="dance"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>Dance<kbd>2</kbd></button>
  <button data-emote="cheer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.3 5.2 5.7.5-4.3 3.8 1.3 5.5L12 15.2 7 18l1.3-5.5L4 8.7l5.7-.5z"/></svg>Cheer<kbd>3</kbd></button>
  <button data-emote="show"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12c3-4 7-5.5 11-4.5L19 5v14l-5-2.5C10 17.5 6 16 3 12z"/><path d="M16 11h.01" stroke-width="3"/></svg>Show off<kbd>4</kbd></button>
</div>
<div id="feed"></div>
<div id="shakeLayer"></div>
<div id="reelCatch" hidden></div>
<div class="glass" id="reel" hidden>
  <div class="reel-top"><span id="reelName">???</span><span id="reelRar"></span></div>
  <div class="reel-track" id="reelTrack"><div id="reelBar"></div><svg id="reelFish" viewBox="0 0 40 26"><path d="M2 4 L11 13 L2 22 Z" fill="#ffd84a"/><ellipse cx="24" cy="13" rx="14" ry="9" fill="#ffd84a"/><circle cx="31" cy="11" r="2" fill="#33405a"/></svg></div>
  <div class="reel-prog"><div id="reelFill"></div></div>
  <div class="reel-hint" id="reelHint">Hold to push the bar right · release to drift left</div>
</div>
<div class="glass" id="catchCard" hidden></div>
<div id="toasts"></div>
<div id="panelWrap" hidden><div id="panel" class="glass" role="dialog" aria-modal="true" aria-labelledby="pTitle"><div class="ph"><div class="grow"><h2 id="pTitle"></h2><p id="pSub"></p></div><button class="ib" id="pClose" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div class="pb2" id="pBody"></div></div></div>
<div id="joinWrap" hidden><div id="join" class="glass"></div></div>
<div class="glass" id="photoBar" hidden>
  <b>Photo mode</b>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  <input type="range" id="photoTime" min="0" max="1" step="0.001" aria-label="Time of day">
  <button class="btn sm sky" id="photoExit">Exit</button>
</div>

<script>
window.__diFail=function(msg){var l=document.getElementById('ldMsg');if(l)l.textContent=msg;};
window.addEventListener('error',function(e){var ld=document.getElementById('loading');if(ld&&!ld.classList.contains('out'))window.__diFail('Something went wrong while loading: '+(e.message||'unknown error')+'. Try reopening the page.');});
</script>
<script type="module" src="/src/main.js"></script>
</body>
</html>
